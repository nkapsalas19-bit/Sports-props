databases:
  - name: sports-props-db
    databaseName: sports_props
    user: sports_props
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: sports-props
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sports-props-db
          property: connectionString
      - key: ODDS_PROVIDER
        value: mock
      - key: ODDS_API_KEY
        sync: false
      - key: STATS_PROVIDER
        value: ""
      - key: API_SPORTS_KEY
        sync: false
      - key: API_SPORTS_MAX_CALLS
        value: "90"
      - key: GOOD_ODDS_MIN
        value: "-250"
      - key: GOOD_ODDS_MAX
        value: "250"
      - key: MIN_EDGE
        value: "0.03"
